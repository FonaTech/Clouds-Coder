[flake8]
max-line-length = 88
extend-ignore = E203
# Generated Code_Structure modules share the monolith's ordered runtime
# namespace. Their F821 findings are suppressed in generated file headers;
# keep the tree included so syntax and other fatal checks still run.
exclude =
    .git,
    backups,
    build,
    dist,
    *.egg-info,
    __pycache__,
    Code_Library,
    RAG_Library,
    Codes,
    skills,
    learn-claude-code-main,
    js_lib,
    */Split?Tools/*,
    Clouds_Coder_*.py,
    *.bak*,
    *.backup_*
per-file-ignores =
    # The monolith embeds large HTML/CSS/JavaScript assets and retains legacy
    # indentation in source-complete runtime sections. Keep semantic Flake8
    # checks active while exempting only those established layout rules.
    Clouds_Coder.py:E101,E117,E122,E125,E127,E131,E261,E301,E302,E303,E305,E306,E501,W191,W291
    # These maintained utilities contain long fixture payloads and routing
    # tables; Ruff continues to enforce their configured semantic rules.
    split_coder.py:E501
    repro_*.py:E501
    test_plan_single_architecture.py:E501
    Code_Structure/*.py:F821

[tool:pytest]
testpaths =
    tests
